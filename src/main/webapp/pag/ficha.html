<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbe - Ficha do Personagem</title>
    <link rel="stylesheet" href="../css/ficha.css">
</head>
<body>

<header id="menu">
    <a href="./dashboard.html" class="logo-orbe" title="Voltar para o Painel">

        <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="glowOrbe" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
                    <stop offset="40%" stop-color="#E63946" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#8B1E28" stop-opacity="0"/>
                </radialGradient>
            </defs>

            <circle cx="50" cy="50" r="44" fill="none" stroke="#8B1E28" stroke-width="2" stroke-dasharray="15 10" opacity="0.8">
                <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="15s" repeatCount="indefinite"/>
            </circle>

            <circle cx="50" cy="50" r="36" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="20 5 5 5" opacity="0.6">
                <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="10s" repeatCount="indefinite"/>
            </circle>

            <circle cx="50" cy="50" r="28" fill="url(#glowOrbe)"/>

            <polygon points="50,20 54,46 80,50 54,54 50,80 46,54 20,50 46,46" fill="#FFFFFF" opacity="0.9"/>
        </svg>

    </a>
</header>

<main id="painel-superior" class="grid-layout">

    <section id="figPersonagem" class="coluna-card">
        <h2 class="titulo-secao">Retrato</h2>

        <div class="moldura-imagem" style="display: flex; justify-content: center; align-items: center; background-color: rgba(255,255,255,0.05);">
            <span id="letra-avatar" style="font-size: 8rem; font-weight: bold; color: var(--cor-luz-branca);">?</span>
        </div>


        <input type="file" id="input-foto" class="input-orbe" accept="image/*" style="margin-top: 10px;">

        <div class="info-basica" style="margin-top: 20px;">
            <label>Nome:</label>
            <input type="text" id="nome-personagem" class="input-orbe" placeholder="Nome do Personagem" readonly>

            <label>Estilo:</label>
            <input type="text" id="estilo-personagem" class="input-orbe" placeholder="Estilo" readonly>

            <label>Raça:</label>
            <input type="text" id="raca-personagem" class="input-orbe" placeholder="Raça" readonly>
        </div>
    </section>

    <section id="ficha" class="coluna-card card-central">
        <h2 class="titulo-secao">Atributos e Status</h2>

        <div class="nivel-box">
            <div>
                <span>Nível:</span>
                <span id="nivel-valor" class="destaque-branco">1</span>
            </div>
            <div>
                <label>Exp:</label>
                <input type="number" id="xp-valor" class="input-orbe input-curto" placeholder="0">
            </div>
        </div>

        <div class="grid-atributos">
            <div class="atributo-item"><label>Força</label><input type="number" id="attr-forca" class="input-orbe" placeholder="0"></div>
            <div class="atributo-item"><label>Velocidade</label><input type="number" id="attr-velocidade" class="input-orbe" placeholder="0"></div>
            <div class="atributo-item"><label>Destreza</label><input type="number" id="attr-destreza" class="input-orbe" placeholder="0"></div>
            <div class="atributo-item"><label>Vigor</label><input type="number" id="attr-vigor" class="input-orbe" placeholder="0"></div>
            <div class="atributo-item"><label>Sabedoria</label><input type="number" id="attr-sabedoria" class="input-orbe" placeholder="0"></div>
            <div class="atributo-item"><label>Inteligência</label><input type="number" id="attr-inteligencia" class="input-orbe" placeholder="0"></div>
        </div>

        <button id="btn-salvar-ficha" class="btn-orbe" style="width: 100%; margin-top: 20px; background-color: var(--cor-detalhe-vermelho);">Salvar Alterações
        </button>

        <h3 class="subtitulo-secao">Energias e Status Calculados</h3>
        <div class="grid-substatus">
            <div class="substatus-item">Vida: <span class="destaque-branco" id="status-vida">0</span></div>
            <div class="substatus-item">Energia Sagrada: <span class="destaque-branco" id="status-sagrada">0</span></div>
            <div class="substatus-item">Energia Amaldiçoada: <span class="destaque-branco" id="status-amaldicoada">0</span></div>
            <div class="substatus-item">Pesquisa: <span class="destaque-branco" id="status-pesquisa">0</span></div>
            <div class="substatus-item">Conhecimento: <span class="destaque-branco" id="status-conhecimento">0</span></div>
        </div>
    </section>

    <section id="hab" class="coluna-card">
        <h2 class="titulo-secao">Habilidades</h2>

        <div id="hab-create" class="form-container">
            <input type="text" id="hab-titulo" class="input-orbe" placeholder="Título da Habilidade">
            <select id="hab-tipo" class="select-orbe">
                <option value="Tática" selected>Tática (Padrão)</option>
                <option value="Inspiração">Inspiração</option>
                <option value="Postura">Postura</option>
            </select>
            <textarea id="hab-desc" class="textarea-orbe" rows="3" placeholder="Descrição..."></textarea>
            <button id="btn-add-hab" class="btn-orbe btn-pequeno" style="width: 100%; margin-top: 10px;">Adicionar Habilidade</button>
        </div>

        <hr class="divisor">

        <div id="hab-load" class="lista-cards">
            <div class="card-mini">
                <div class="card-mini-header">
                    <h4>Golpe Preciso</h4>
                    <span class="badge-tipo">Tática</span>
                </div>
                <p>O jogador ataca um ponto fraco exposto do inimigo.</p>
                <div class="card-acoes">
                    <button class="btn-acao">Editar</button>
                    <button class="btn-acao btn-perigo">Excluir</button>
                </div>
            </div>
        </div>
    </section>

</main>

<section id="inventario" class="secao-inferior">
    <details class="caixa-expansivel" open>
        <summary class="titulo-secao">Mochila & Inventário</summary>

        <div id="pack-create" class="form-inventario-linha">

            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">

                <label for="item-foto" style="cursor: pointer; display: flex; justify-content: center; align-items: center; width: 44px; height: 44px; border: 1px dashed rgba(255,255,255,0.3); border-radius: 8px; transition: 0.3s;" onmouseover="this.style.borderColor='var(--cor-luz-branca)'; this.style.backgroundColor='rgba(255,255,255,0.05)'; this.querySelector('svg').style.color='var(--cor-luz-branca)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.3)'; this.style.backgroundColor='transparent'; this.querySelector('svg').style.color='var(--text-secondary)'" title="Anexar Imagem">

                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary); transition: 0.3s;">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>

                </label>

                <input type="file" id="item-foto" accept="image/*" style="display: none;" onchange="document.getElementById('nome-arquivo-foto').textContent = this.files[0] ? this.files[0].name : ''">
                <span id="nome-arquivo-foto" style="color: var(--text-secondary); font-size: 0.7rem; max-width: 80px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 5px;"></span>

            </div>


            <input type="text" id="item-titulo" class="input-orbe" placeholder="Nome do Item">


            <textarea id="item-desc" class="textarea-orbe" rows="1" placeholder="Descrição completa..."></textarea>

            <button id="btn-add-item" class="btn-orbe btn-pequeno">Adicionar</button>
        </div>

        <div id="pack-load" class="lista-inventario-vertical">
        </div>
    </details>
</section>
<footer>Feito por Jefferson C Souza</footer>

<script src="../js/app.js"></script>
</body>
</html>
