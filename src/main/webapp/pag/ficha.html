<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbe - Ficha do Personagem</title>
    <link rel="stylesheet" href="../css/orbe.css">
</head>
<body>

<header id="menu">
    <nav>
        <a href="../index.html" class="btn-orbe">Voltar para Minhas Fichas</a>
    </nav>
</header>

<main id="painel-superior" class="grid-layout">

    <section id="figPersonagem" class="coluna-card">
        <h2 class="titulo-secao">Retrato</h2>
        <div class="moldura-imagem">
        </div>
    </section>

    <section id="ficha" class="coluna-card card-central">
        <h2 class="titulo-secao">Atributos</h2>
    </section>

    <section id="hab" class="coluna-card">
        <h2 class="titulo-secao">Habilidades</h2>
    </section>

</main>

<section id="inventario" class="secao-inferior">
    <details class="caixa-expansivel">
        <summary class="titulo-secao">Mochila & Inventário</summary>

        <ul id="lista-itens">
            <li><span class="destaque">Item:</span> Poção de Vida</li>
            <li><span class="destaque">Arma:</span> Espada Longa</li>
        </ul>
    </details>
</section>

<footer>Feito por Jefferson C Souza</footer>

<script src="../js/app.js"></script>
</body>
</html>
